<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0b758"/>
      <stop offset="100%" stop-color="#d89530"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1f26"/>
      <stop offset="100%" stop-color="#14151a"/>
    </linearGradient>
  </defs>

  <!-- Phone body with subtle shadow -->
  <rect x="76" y="20" width="104" height="216" rx="22" ry="22" fill="url(#amber)"
        stroke="#a47829" stroke-width="2"/>

  <!-- Speaker slot -->
  <rect x="118" y="32" width="20" height="3" rx="1.5" fill="#a47829"/>

  <!-- Screen -->
  <rect x="86" y="46" width="84" height="166" rx="4" fill="url(#screen)"/>

  <!-- Upload arrow on screen (sending) -->
  <g stroke="#f4f1e8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 128 175 L 128 95"/>
    <path d="M 92 128 L 128 92 L 164 128"/>
  </g>

  <!-- Home indicator bar -->
  <rect x="112" y="222" width="32" height="3" rx="1.5" fill="#a47829"/>
</svg>
